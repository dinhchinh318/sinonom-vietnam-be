services:
  backend:
    build: .
    container_name: my-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Cache HuggingFace để khỏi tải lại
      - hf_cache:/root/.cache/huggingface

      # Nếu bạn có model local trên server, mount vào /app/models
      # (trên server bạn sẽ tạo thư mục /opt/myapp/models)
      - /opt/myapp/models:/app/models:ro

    restart: unless-stopped

volumes:
  hf_cache:
